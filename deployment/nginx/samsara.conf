server {
    listen 80;
    listen [::]:80;
    server_name samsaracikuray.id www.samsaracikuray.id simulasi.samsaracikuray.id;

    # Validasi HTTP-01 Let's Encrypt harus bisa diakses lewat port 80 (sebelum sertifikat ada)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/samsara/public;
    }

    location / {
        return 301 https://samsaracikuray.id$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name samsaracikuray.id www.samsaracikuray.id;
    root /var/www/samsara/public;

    # SSL Certificates (Let's Encrypt). Terbitkan dulu: certbot certonly --webroot -w /var/www/samsara/public -d samsaracikuray.id -d www.samsaracikuray.id
    ssl_certificate /etc/letsencrypt/live/samsaracikuray.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samsaracikuray.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    index index.php index.html;
    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions Policy: camera=(self) wajib aktif untuk pemindai barcode / QR tiket Gatekeeper & Ranger
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Max body size for file uploads (e.g. KTP verifications, payment proofs)
    client_max_body_size 12M;

    # Frontend / SPA Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PWA Manifest & Service Worker
    location ~* ^/(manifest\.(webmanifest|json)|sw\.js|offline\.html)$ {
        access_log off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static Assets Caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Berkas unggahan publik (bukti bayar, foto regu, logo) tidak pernah dieksekusi sebagai PHP
    location ^~ /storage/ {
        location ~ \.php$ { deny all; }
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # PHP-FPM execution — hanya front controller Laravel; .php lain di public/ ditolak
    location ~ \.php$ {
        return 404;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        # For PHP 8.3 use: fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny direct access to hidden files and sensitive configuration files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|git|yml|yaml|md|lock)$ {
        deny all;
    }

    location ~* (composer\.json|package(-lock)?\.json|tsconfig\.json)$ {
        deny all;
    }
}
