server {
    listen 80;
    listen [::]:80;
    server_name samsara.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name samsara.yourdomain.com;
    root /var/www/samsara/public;

    # SSL Certificates (managed via Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/samsara.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/samsara.yourdomain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    index index.php index.html;
    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Max body size for file uploads (e.g. KTP verifications)
    client_max_body_size 12M;

    # Frontend / SPA Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets Caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # PHP-FPM execution
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        # For PHP 8.3 use: fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny direct access to hidden files and sensitive configuration files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|git|yml|yaml|md|json|lock)$ {
        deny all;
    }
}
