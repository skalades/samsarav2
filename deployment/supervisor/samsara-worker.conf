[program:samsara-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/samsara/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/samsara/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

; Scheduler Laravel (expire booking belum bayar tiap 5 menit, purge KTP & foto regu, heartbeat).
; Alternatif tanpa supervisor — crontab www-data:
;   * * * * * cd /var/www/samsara && php artisan schedule:run >> /dev/null 2>&1
[program:samsara-scheduler]
command=php /var/www/samsara/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/samsara/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
