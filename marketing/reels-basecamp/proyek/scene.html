  tents.forEach(tn => { const k = eback((t - 34.1 - tn.userData.d) / .45); tn.visible = k > 0; tn.scale.setScalar(Math.max(k, .001)); });
  { const k = eback((t - 39.55) / .45); carrier.visible = k > 0; carrier.scale.setScalar(1.3 * Math.max(k, .001)); carrier.rotation.y = t * .6; }
  saungs.forEach((s, i) => { const k = t > 28.2 && t < 33.85 ? 1 + .25 * Math.max(0, Math.sin((t - 28.2) * 4 - i)) : 1; s.scale.setScalar(k * 1.3); });
  // clouds
  {
    const k = eio((t - 47.6) / 2.2);
    cloudMat.opacity = k * .97; clouds.visible = k > 0;
    cloudSea.material.opacity = k * .92; cloudSea.visible = k > 0;
    shadowTri.material.opacity = eio((t - 49.5) / 2.5) * .42;
  }
  // phone
  {
    const vis = t > 9.4 && t < 15.7; phone.visible = vis;
    if (vis) {
      drawPhone(t);
      const kin = eback((t - 9.45) / .6), kout = eio((t - 15.2) / .45);
      phone.position.set(0, lerp(-3.4, -.22, kin) + kout * 3.6, -3.4);
      phone.rotation.set(lerp(.8, 0, kin) - .05, Math.sin(t * 1.6) * .28 + (1 - kin) * 1.5, Math.sin(t * 1.1) * .04);
    }
  }
  // shield
  {
    const vis = t > 45.0 && t < 48.4; shield.visible = vis;
    if (vis) {
      const kin = eback((t - 45.1) / .6), kout = eio((t - 47.95) / .3);
      shield.scale.setScalar(Math.max(.001, kin * (1 - kout)));
      shield.rotation.set(.05, (1 - eout((t - 45.1) / .9)) * Math.PI * 2 + Math.sin(t * 2) * .35, 0);
    }
  }
  renderer.render(scene, camera);
  updateUI(t);
  return true;
};

(async () => {
  for (const w of [600, 700, 800, 900]) await document.fonts.load(`${w} 50px Poppins`);
  await document.fonts.ready;
  shield.userData.redraw();
  window.renderFrame(0);
  window.READY = true;
})();
</script>
</body></html>
